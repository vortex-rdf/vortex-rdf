[workspace]
resolver = "2"
members = ["core", "encoded-search", "js", "cli", "python"]
# The python crate is a PyO3 extension module built by maturin; keep it out of
# the default cargo build/test surface.
default-members = ["core", "encoded-search", "js", "cli"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
authors = ["Julián Rojas <julianandres.rojasmelendez@ugent.be>"]
license = "MIT"
repository = "https://github.com/vortex-rdf/vortex-rdf"
description = "Modern and high-performance columnar RDF serialization format"
readme = "README.md"
keywords = ["rdf", "columnar", "vortex", "semantic-web", "quad-store"]
categories = ["database-implementations", "encoding", "data-structures"]

[workspace.dependencies]
vortex-rdf-core = { path = "core", version = "0.11.0" }
vortex-rdf-encoded-search = { path = "encoded-search", version = "0.11.0" }
vortex = { version = "0.85.0", default-features = false }
vortex-array = { version = "0.85.0" }
vortex-btrblocks = "0.85.0"
vortex-error = "0.85.0"
vortex-fastlanes = "0.85.0"
vortex-io = "0.85.0"
vortex-runend = "0.85.0"
vortex-sequence = "0.85.0"
vortex-session = "0.85.0"
vortex-fsst = "0.85.0"
vortex-edition = "0.85.0"
vortex-mask = "0.85.0"
vortex-file = { version = "0.85.0" }
vortex-scan = "0.85.0"
vortex-layout = "0.85.0"
vortex-buffer = "0.85.0"
vortex-arrow = "0.85.0"
# The arrow-rs majors vortex-arrow 0.85 itself requires: the graph must only
# ever resolve one arrow-rs version (`cargo tree -i arrow-array`).
arrow-array = "58.3"
arrow-schema = "58.3"
arrow-buffer = "58.3"
arrow-ipc = "58.3"
self_cell = "1.2"
divan = { package = "codspeed-divan-compat", version = "5.0.1" }

tokio = { version = "1.53", features = ["sync", "macros", "rt"] }
futures = "0.3.33"
async-trait = "0.1"

oxrdf = "0.3.3"
oxrdfio = "0.2.5"
thiserror = "2.0"
anyhow = "1.0.104"

clap = { version = "4.6", features = ["derive"] }
pyo3 = "0.29.0"
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
console_error_panic_hook = "0.1.7"
mimalloc = "0.1.52"
web-time = "1.1"
