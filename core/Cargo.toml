[package]
name = "vortex-rdf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = "1.12"
vortex.workspace = true
vortex-array.workspace = true
vortex-error.workspace = true
vortex-io.workspace = true
vortex-session.workspace = true
vortex-fsst.workspace = true
vortex-mask.workspace = true
vortex-layout.workspace = true
vortex-edition.workspace = true
vortex-file.workspace = true
vortex-scan.workspace = true
vortex-buffer.workspace = true
vortex-arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-buffer.workspace = true
# Encoding-aware bounds search over compressed columns (sibling workspace crate).
vortex-rdf-encoded-search.workspace = true

tokio.workspace = true

# RDF handling
oxrdf.workspace = true
oxrdfio.workspace = true

# Utilities
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
rkyv = { version = "0.8.17", features = ["std", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

futures.workspace = true
async-trait.workspace = true
log = "0.4.33"
clap = { workspace = true, optional = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { workspace = true, optional = true }

# The microtask-queue `WasmRuntime` lives behind vortex-io's `wasm-bindgen`
# feature; the wasm bindings already link wasm-bindgen, so this adds no size.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
vortex-io = { workspace = true, features = ["wasm-bindgen"] }

[features]
default = ["file-io"]
file-io = [
    "vortex-io/tokio",
    "vortex/files",
    "vortex-file/tokio",
    "tokio/fs",
    "vortex-rdf-encoded-search/layout",
]
# Opt-in: let a binary that depends on this crate have it install mimalloc as
# the process's global allocator, instead of picking one itself.
mimalloc = ["dep:mimalloc"]
# Opt-in: derive `clap::ValueEnum` on the builder/layout/index strategy enums,
# so a CLI can take them as arguments. Off by default — the wasm and python
# builds have no use for an argument parser.
clap = ["dep:clap"]

[dev-dependencies]
divan = { workspace = true }
oxigraph = { version = "0.5.9", default-features = false, features = ["rocksdb"] }
sophia = "0.10"
hdt = { version = "0.7", features = ["nt"] }
tempfile = "3"
tokio = { workspace = true, features = ["time", "rt-multi-thread"] }

[[bench]]
name = "benchmark"
harness = false
required-features = ["file-io"]

[[bench]]
name = "match_lazy"
harness = false
required-features = ["file-io"]

[[bench]]
name = "compare"
harness = false
required-features = ["file-io"]

[[test]]
name = "bench_dataset"
required-features = ["file-io"]
