[package]
name = "vortex-rdf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vortex.workspace = true
vortex-array.workspace = true
vortex-error.workspace = true
vortex-io.workspace = true
vortex-session.workspace = true
vortex-fsst.workspace = true
vortex-mask.workspace = true
vortex-layout.workspace = true
vortex-edition.workspace = true
vortex-file.workspace = true
vortex-scan.workspace = true
vortex-buffer.workspace = true
# Memory-mapped store files (`VortexRdfStore::from_file`); enabled by `file-io`
# together with vortex-buffer's `memmap2` feature (`ByteBuffer: From<Mmap>`).
memmap2 = { version = "0.9", optional = true }
# Fast hasher for code-keyed maps: the code → term map a chunk decode builds
# over a file-backed dictionary, and the hashed right index of an equi-join.
rustc-hash = "2.1.3"
vortex-btrblocks.workspace = true
# Encoding-aware bounds search over compressed columns (sibling workspace crate).
vortex-rdf-encoded-search.workspace = true

tokio.workspace = true

# RDF handling
oxrdf.workspace = true
oxrdfio.workspace = true

# Utilities
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
rkyv = { version = "0.8.17", features = ["std", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

futures.workspace = true
async-trait.workspace = true
log = "0.4.33"
clap = { workspace = true, optional = true }
web-time = { workspace = true }
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { workspace = true, optional = true }

# The microtask-queue `WasmRuntime` lives behind vortex-io's `wasm-bindgen`
# feature; the wasm bindings already link wasm-bindgen, so this adds no size.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
vortex-io = { workspace = true, features = ["wasm-bindgen"] }

[features]
default = ["file-io"]
file-io = [
    "vortex-io/tokio",
    "vortex/files",
    "vortex-file/tokio",
    "tokio/fs",
    "vortex-rdf-encoded-search/layout",
    "vortex-buffer/memmap2",
    "dep:memmap2",
]
# Opt-in: let a binary that depends on this crate have it install mimalloc as
# the process's global allocator, instead of picking one itself.
mimalloc = ["dep:mimalloc"]
# Opt-in: derive `clap::ValueEnum` on the builder/layout/index strategy enums,
# so a CLI can take them as arguments. Off by default — the wasm and python
# builds have no use for an argument parser.
clap = ["dep:clap"]

# Every public item has one public path: a `pub` item that is reachable from
# the API but re-exported nowhere has none, and the gates run with `-D warnings`.
[lints.rust]
unnameable_types = "warn"

[dev-dependencies]
divan = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["time", "rt-multi-thread"] }

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "match_lazy"
harness = false

[[test]]
name = "bench_dataset"

[[test]]
name = "experimental_patched"

[[test]]
name = "replace_mapped_store"

[[test]]
name = "relative_path_compaction"
