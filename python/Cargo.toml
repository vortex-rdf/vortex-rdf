[package]
name = "vortex-rdf-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Vortex-RDF (published to PyPI as vortex-rdf)"
publish = false

# The compiled module is imported as `vortex_rdf._native` (see
# `[tool.maturin] module-name` in pyproject.toml). `test = false` keeps
# `cargo test --workspace` from producing a test binary that would need to
# link libpython — the crate's behavior is covered by the pytest suite.
[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
vortex-rdf-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
vortex-buffer.workspace = true
# The Arrow C Data Interface structs behind the PyCapsule protocol, at the one
# arrow-rs version the workspace pins.
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema.workspace = true
futures.workspace = true
