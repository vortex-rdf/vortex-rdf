[package]
name = "vortex-rdf-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Vortex-RDF (published to PyPI as vortex-rdf)"
publish = false

# The compiled module is imported as `vortex_rdf._native` (see
# `[tool.maturin] module-name` in pyproject.toml). `test = false` keeps
# `cargo test --workspace` from producing a test binary that would need to
# link libpython — the crate's behavior is covered by the pytest suite, apart
# from the bounded batch driver (`src/batch.rs`) and the cancellable pull
# (`src/cancel.rs`), both free of Python types, which `tests/batch.rs` and
# `tests/cancel.rs` compile on their own.
[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
vortex-rdf-core = {workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
futures = { workspace = true }
vortex-buffer.workspace = true
arrow-pyarrow = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-cast = { workspace = true, optional = true }

[features]
arrow = [
    "dep:arrow-pyarrow",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-cast",
    "vortex-rdf-core/arrow",
]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"
