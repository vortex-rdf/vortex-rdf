name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
    # Doc-only changes move no instruction counts; workflow_dispatch stays as
    # the escape hatch since path filters never apply to it.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions: # optional for public repositories
 contents: read # required for actions/checkout
 id-token: write # required for OIDC authentication with CodSpeed
  
jobs:
  benchmarks:
    name: Run Rust benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      # Only the benchmark target is uploaded; match_lazy belongs to the
      # dashboard workflow, so instrumenting it here would be wasted work.
      - name: Build the benchmark target
        run: cargo codspeed build --bench benchmark

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run --bench benchmark
        env:
          DIVAN_SAMPLE_COUNT: 10

  js-benchmarks:
    name: Run JS benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # wasm-pack (invoked by `npm run build`) needs a Rust toolchain with the
      # wasm target; the bindings are compiled fresh so the bench measures HEAD.
      - name: Setup Rust toolchain (for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install deps and build the wasm bindings
        working-directory: js
        run: |
          npm ci
          npm run build

      # Same CodSpeed project and mode as the Rust job (simulation = instruction
      # counting), so the JS bindings' tasks publish with flamegraphs next to the
      # Rust benchmarks. Invoke node with the tsx loader directly (not `npx tsx`)
      # so there is no extra process layer between the CodSpeed runner and the
      # benchmark.
      - name: Run the JS benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # --no-liftoff: the plugin measures a single invocation per task, and
          # V8's background wasm tier-up raced it — the measured run
          # nondeterministically executed Liftoff or TurboFan code, a ~2x
          # instruction-count swing on the build tasks at identical code.
          # Top-tier-only compilation is deterministic; its one-time lazy
          # compile cost is absorbed by the plugin's untimed warmup calls.
          run: node --import tsx --expose-gc --no-liftoff bench/codspeed.bench.ts
          working-directory: js

  python-benchmarks:
    name: Run Python benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The extension is compiled fresh so the benchmark measures HEAD, the
      # same reason the JS job rebuilds the wasm bindings.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: python-codspeed

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the bindings
        working-directory: python
        run: uv sync

      # Same CodSpeed project and mode as the other jobs (simulation =
      # instruction counting), so the Python read paths publish alongside them.
      - name: Run the Python benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest bench/test_codspeed.py --codspeed
          working-directory: python
