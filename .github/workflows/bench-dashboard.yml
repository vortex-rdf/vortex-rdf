name: Benchmark Dashboard

on:
  push:
    branches:
      - main
    # Skip the benchmark runs on doc-only pushes. Deliberately narrow:
    # scripts/ holds the dashboard's inputs.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # The cross-library stage formats and lints bench-compare/ before it
          # benches it.
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # bench-compare/ is a workspace of its own, with a target directory
          # of its own.
          workspaces: |
            .
            bench-compare
          # The bench profile is this job's alone — no sibling to share with.
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      # The built bindings, each with the stamp scripts/refresh.sh writes
      # beside it: a restored artifact whose stamp still matches is not rebuilt
      # (wasm-pack plus wasm-opt cost ~10 minutes, `maturin develop --release`
      # ~4). Each key hashes every input of its stamp: the files it is built
      # from, refresh.sh (the build command) and the setup-rust pin (the
      # compiler), so a key hit never restores a stamp that would make every
      # run rebuild.
      - name: Cache wasm bindings
        uses: actions/cache@v6
        with:
          path: js/pkg/web
          key: wasm-pkg-${{ hashFiles('core/src/**', 'core/Cargo.toml', 'encoded-search/src/**', 'encoded-search/Cargo.toml', 'js/src/**', 'js/Cargo.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'scripts/refresh.sh', '.github/actions/setup-rust/action.yml') }}

      - name: Cache hdt wasm wrapper
        uses: actions/cache@v6
        with:
          path: js/bench/hdt-pkg
          key: hdt-pkg-${{ hashFiles('js/bench/hdt-wasm/src/**', 'js/bench/hdt-wasm/Cargo.toml', 'js/bench/hdt-wasm/Cargo.lock', '.cargo/config.toml', 'scripts/refresh.sh', '.github/actions/setup-rust/action.yml') }}

      - name: Cache Python native extension
        uses: actions/cache@v6
        with:
          path: |
            python/vortex_rdf/_native.abi3.so
            python/vortex_rdf/_native.abi3.so.sha256
          key: py-native-${{ hashFiles('core/src/**', 'core/Cargo.toml', 'encoded-search/src/**', 'encoded-search/Cargo.toml', 'python/src/**', 'python/Cargo.toml', 'python/pyproject.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'scripts/refresh.sh', '.github/actions/setup-rust/action.yml') }}

      # One virtualenv per external library (their dependency sets conflict —
      # pycottas hard-pins an older pyoxigraph). Provisioning them re-downloads
      # every library each run; the pins live in adapters.py, so its hash is
      # the cache identity.
      #
      # The uv-managed interpreter is cached beside the venvs, not for its own
      # sake but because each venv's `bin/python` is an absolute symlink into
      # it: restore the venvs alone and every link dangles, so run.py rebuilds
      # all of them and the cache buys nothing. `PYTHON_VERSION` in run.py is
      # part of the key for the same reason — a bumped interpreter must not
      # come back as a stale one under a fresh venv.
      - name: Cache benchmark virtualenvs
        uses: actions/cache@v6
        with:
          path: |
            python/bench/.venvs
            ~/.local/share/uv/python
          key: py-bench-venvs-${{ hashFiles('python/bench/adapters.py', 'python/bench/run.py') }}

      # Every stage of refresh.sh in its order: the Rust internals and
      # cross-library suites, the JavaScript and Python comparative suites
      # (wall-clock, never uploaded to CodSpeed), then the render into
      # target/bench/public. BENCH_SIZE puts all three tabs on the same data:
      # the JS hdt adapter opens the .hdt artifact the cross-library stage
      # builds from this dataset, and the internals suites' own default is the
      # much smaller CodSpeed size, where instrumented runs measure
      # instructions and a bigger dataset only multiplies valgrind cost.
      # MUT_BATCH is the comparative suites' add/delete batch; refresh.sh keeps
      # it from the internals suite, which uses its own.
      - name: Run the benchmarks and render the dashboard
        env:
          BENCH_SIZE: 1048576
          MUT_BATCH: 10000
        run: scripts/refresh.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/bench/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
