name: CI

on:
  push:
    branches:
      - main
    # Doc-only changes can't break the build (docs.yml checks their anchors).
    # Repeated per event because path filters are not inherited across
    # triggers.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # Lets the release workflow run the full CI suite against the exact ref
  # being published before anything reaches a registry.
  workflow_call:

permissions:
  contents: read

# Each job sets up its tools and runs its commands through
# scripts/ci-check.sh, the definition the pre-push hook runs too.
jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # This job's own entry, the wasm32 clippy's artifacts with it:
          # `cargo clippy` only checks dependencies (metadata, no code), so
          # `rust-tests`, which compiles them, keeps an entry of its own.
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run fmt and clippy
        run: scripts/ci-check.sh lint

  rust-tests:
    name: Rust Tests (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Not the lint job's `dev` entry: that job finishes first and saves
          # the shared key, and its checked dependencies hold no code, so this
          # job compiled its ~325 dependencies on every run.
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust tests
        run: scripts/ci-check.sh rust-tests

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      # The python crate is a member of the root workspace, so maturin writes
      # to <root>/target, the path the cache covers.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with codspeed.yml's python-benchmarks: both build the
          # extension through maturin at the same profile.
          shared-key: py-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The dashboard render test (scripts/test_render_bench_dashboard.py) runs the page's script in Node.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Build the bindings and run the Python tests
        run: scripts/ci-check.sh python-tests

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      # The js crate is a member of the root workspace, so wasm-pack writes to
      # <root>/target, the path the cache covers.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with codspeed.yml's js-benchmarks: same wasm32 target.
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the wasm package and run the JS tests
        run: scripts/ci-check.sh js-tests

  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      # The java crate is a member of the root workspace, so cargo writes to
      # <root>/target, the path the cache covers.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the JNI library and run the Java tests
        run: scripts/ci-check.sh java-tests
