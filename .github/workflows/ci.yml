name: CI

on:
  push:
    branches:
      - main
    # Doc-only changes can't break the build (docs.yml checks their anchors).
    # Repeated per event because path filters are not inherited across
    # triggers.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # Lets the release workflow run the full CI suite against the exact ref
  # being published before anything reaches a registry.
  workflow_call:

permissions:
  contents: read

# Each job sets up its tools and runs its commands through
# scripts/ci-check.sh, the definition the pre-push hook runs too.
jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with `rust-tests`: clippy compiles *dependencies* with plain
          # rustc (only workspace crates go through clippy-driver), so the two
          # jobs' native dev-profile dependency artifacts are the same build.
          # The wasm32 clippy's artifacts are this job's alone: they are in the
          # shared entry only when this job is the one that saves it.
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run fmt and clippy
        run: scripts/ci-check.sh lint

  rust-tests:
    name: Rust Tests (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust tests
        run: scripts/ci-check.sh rust-tests

  # The DataFusion conformance crate is a workspace of its own
  # (interface-tests/Cargo.toml), so its dependency tree builds here only,
  # `--locked` against the crate's own Cargo.lock.
  interface-tests:
    name: Interface Tests (DataFusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: interface-tests
          shared-key: interface-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run fmt, clippy and the interface tests
        run: scripts/ci-check.sh interface-tests

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      # The python crate is a member of the root workspace, so maturin writes
      # to <root>/target, the path the cache covers.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with codspeed.yml's python-benchmarks: both build the
          # extension through maturin at the same profile.
          shared-key: py-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the bindings and run the Python tests
        run: scripts/ci-check.sh python-tests

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      # The js crate is a member of the root workspace, so wasm-pack writes to
      # <root>/target, the path the cache covers.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with codspeed.yml's js-benchmarks: same wasm32 target.
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the wasm package and run the JS tests
        run: scripts/ci-check.sh js-tests
