name: CI

on:
  push:
    branches:
      - main
    # Doc-only changes can't break the build. Repeated per event because path
    # filters are not inherited across triggers (and Actions does not support
    # YAML anchors).
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # Lets the release workflow run the full CI suite against the exact ref
  # being published before anything reaches a registry.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with `rust-tests`: clippy compiles *dependencies* with plain
          # rustc (only workspace crates go through clippy-driver), so the two
          # jobs' dev-profile dependency artifacts are the same build.
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Check doc anchors
        run: scripts/check-doc-anchors.sh
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The no-default-features build has its own dead-code surface (items only
      # reachable through the file-io feature), which the default clippy run
      # cannot see.
      - name: Run clippy (core, no default features)
        run: cargo clippy -p vortex-rdf-core --no-default-features --all-targets -- -D warnings

  rust-tests:
    name: Rust Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: workspace
            command: cargo test --workspace
          - label: core-no-default-features
            command: cargo test -p vortex-rdf-core --no-default-features
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust tests
        run: ${{ matrix.command }}

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      # Both js and python are members of the root workspace, so maturin and
      # wasm-pack write to <root>/target; the cache covers that default path and
      # `key` keeps each job's entry separate.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with codspeed.yml's python-benchmarks: both build the
          # extension through maturin at the same profile.
          shared-key: py-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build bindings and install environment
        working-directory: python
        run: uv sync --locked
      # `bench/test_codspeed.py` runs here too, without `--codspeed`: the plugin
      # then calls each task once instead of instrumenting it, which is a ~1s
      # smoke test of every benchmark against the current bindings. The
      # CodSpeed workflow is otherwise the only thing that ever imports it, so
      # a signature change lands as a red benchmark job on the PR that renames
      # nothing rather than as a test failure on the PR that did.
      - name: Run tests
        working-directory: python
        run: uv run pytest tests bench/test_codspeed.py -q

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with codspeed.yml's js-benchmarks: same wasm32 target.
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-pack is a pinned npm devDependency; `npm ci` installs it and npm
      # run puts node_modules/.bin ahead of anything on PATH.
      - name: Install dependencies
        working-directory: js
        run: npm ci
      - name: Build WASM package
        working-directory: js
        run: npm run build
      # Typechecks after the build: the tsconfigs resolve against the generated
      # pkg/web/vortex_rdf.d.ts.
      - name: Run typecheck
        working-directory: js
        run: npm run typecheck
      - name: Run tests
        working-directory: js
        run: npm test
      # The suite again with V8's resizable wasm buffers on (Node 24.5+ has
      # the flag): the /arrow entry's zero-copy path, which the plain run
      # cannot reach. Both must pass.
      - name: Run tests with zero-copy Arrow views
        working-directory: js
        run: npm run test:zero-copy
